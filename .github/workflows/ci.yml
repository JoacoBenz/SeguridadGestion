name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres real (service container) para validar migraciones y seed.
      # AUTH_SECRET y demás son dummies: los tests stubean el session resolver
      # y el cliente de WhatsApp, así que no se contacta ningún servicio real.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-only-not-secret
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # Sin `version`: la toma del campo packageManager de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Las migraciones tienen que aplicar limpias sobre una DB vacía y el
      # seed correr encima — es lo mismo que pasa en cada deploy nuevo.
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      # E2E contra el build real: login por magic link, registrar → retirar,
      # gating de suscripción, smoke. Playwright levanta `next start` solo.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          AUTH_TRUST_HOST: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
